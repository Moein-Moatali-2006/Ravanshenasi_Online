
<div id="carouselStackedIndicators"
     class="carousel slide container my-4"
     data-bs-ride="carousel"
     data-bs-interval="4000">

    <div class="carousel-inner rounded-5">

        <div class="carousel-item active">
            <img src="{{ url_for('static', filename='images/slider1.png') }}"
                 class="d-block w-100 carousel-image"
                 alt="زوج درمانی">
        </div>

        <div class="carousel-item">
            <img src="{{ url_for('static', filename='images/slider2.png') }}"
                 class="d-block w-100 carousel-image"
                 alt="سکس تراپی">
        </div>

        <div class="carousel-item">
            <img src="{{ url_for('static', filename='images/slider3.png') }}"
                 class="d-block w-100 carousel-image"
                 alt="مشاوره فردی">
        </div>

        <div class="carousel-item">
            <img src="{{ url_for('static', filename='images/slider4.png') }}"
                 class="d-block w-100 carousel-image"
                 alt="اختلالات روان">
        </div>

        <div class="carousel-item">
            <img src="{{ url_for('static', filename='images/slider5.png') }}"
                 class="d-block w-100 carousel-image"
                 alt="مشاوره تحصیلی">
        </div>

    </div>

    <!-- btn for previus slide -->
    <button class="carousel-control-prev"
            type="button"
            data-bs-target="#carouselStackedIndicators"
            data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">قبلی</span>
    </button>

    <!-- btn for next slide -->
    <button class="carousel-control-next"
            type="button"
            data-bs-target="#carouselStackedIndicators"
            data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">بعدی</span>
    </button>

    <!-- show sliders -->
    <div class="carousel-indicators">

        <button type="button"
                data-bs-target="#carouselStackedIndicators"
                data-bs-slide-to="0"
                class="active"
                aria-current="true"
                aria-label="اسلاید اول"></button>

        <button type="button"
                data-bs-target="#carouselStackedIndicators"
                data-bs-slide-to="1"
                aria-label="اسلاید دوم"></button>

        <button type="button"
                data-bs-target="#carouselStackedIndicators"
                data-bs-slide-to="2"
                aria-label="اسلاید سوم"></button>

        <button type="button"
                data-bs-target="#carouselStackedIndicators"
                data-bs-slide-to="3"
                aria-label="اسلاید چهارم"></button>
        <button type="button"
                data-bs-target="#carouselStackedIndicators"
                data-bs-slide-to="4"
                aria-label="اسلاید پنجم"></button>

    </div>

</div>

<style>
    .carousel-image {
        width: 100%;
        height: 400px;
        object-fit: cover;
    }

    @media (max-width: 768px) {
        .carousel-image {
            height: 230px;
        }
    }
</style>
