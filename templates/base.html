<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Moein Moatali">
    <meta name="robots" content="{% block robots %}index,follow{% endblock %}">
    <link rel="canonical" href="{% block canonical_url %}{{ public_base_url }}{{ request.path }}{% endblock %}">

    <link rel="icon" href="{{ url_for('static', filename='images/icon.png') }}" type="image/png">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/navbar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/footer.css') }}">
    {% block page_css %}{% endblock %}

    <meta name="description" content="{% block meta_description %}خدمات روان‌شناسی و مشاوره آنلاین{% endblock %}">
    {% block head_extra %}{% endblock %}
    <title>{% block title %}{% endblock %}</title>
</head>
<body class="d-flex flex-column min-vh-100">

    {% include 'inc/navbar.html' %}

    <div class="flex-grow-1">
        {% block content %} {% endblock %}
    </div>

    {% include "inc/footer.html" %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
