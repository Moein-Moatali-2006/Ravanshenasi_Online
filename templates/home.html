{% extends "base.html" %}

{% block content %}

<div id="carouselStackedIndicators" class="carousel slide container my-4">

    <div class="carousel-inner rounded-5">

        <div class="carousel-item active">
            <img src="{{ url_for('static', filename='images/c1.jpg') }}"
                 class="d-block w-100 carousel-image"
                 alt="تصویر اول">
        </div>

        <div class="carousel-item">
            <img src="{{ url_for('static', filename='images/c2.jpg') }}"
                 class="d-block w-100 carousel-image"
                 alt="تصویر دوم">
        </div>

        <div class="carousel-item">
            <img src="{{ url_for('static', filename='images/c3.jpg') }}"
                 class="d-block w-100 carousel-image"
                 alt="تصویر سوم">
        </div>

        <div class="carousel-item">
            <img src="{{ url_for('static', filename='images/c4.jpg') }}"
                 class="d-block w-100 carousel-image"
                 alt="تصویر چهارم">
        </div>

    </div>

    <!-- Controls -->
    <button class="carousel-control-prev" type="button"
            data-bs-target="#carouselStackedIndicators"
            data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">قبلی</span>
    </button>

    <button class="carousel-control-next" type="button"
            data-bs-target="#carouselStackedIndicators"
            data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">بعدی</span>
    </button>

    <!-- Indicators -->
    <div class="carousel-indicators">
        <button type="button"
                data-bs-target="#carouselStackedIndicators"
                data-bs-slide-to="0"
                class="active"
                aria-current="true"
                aria-label="اسلاید اول"></button>

        <button type="button"
                data-bs-target="#carouselStackedIndicators"
                data-bs-slide-to="1"
                aria-label="اسلاید دوم"></button>

        <button type="button"
                data-bs-target="#carouselStackedIndicators"
                data-bs-slide-to="2"
                aria-label="اسلاید سوم"></button>

        <button type="button"
                data-bs-target="#carouselStackedIndicators"
                data-bs-slide-to="3"
                aria-label="اسلاید چهارم"></button>
    </div>

</div>

<style>
    .carousel-image {
        width: 100%;
        height: 400px;
        object-fit: cover;
    }

    @media (max-width: 768px) {
        .carousel-image {
            height: 230px;
        }
    }
</style>

{% endblock %}
