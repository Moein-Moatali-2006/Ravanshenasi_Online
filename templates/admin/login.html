{% extends "admin/base.html" %}

{% block title %}ورود ادمین{% endblock %}

{% block admin_content %}
<section class="admin-login-page">
    <div class="admin-login-card">
        <span class="admin-login-icon"><i class="bi bi-shield-lock"></i></span>
        <span class="admin-kicker">دسترسی محدود</span>
        <h1>ورود به پنل مدیریت</h1>
        <p>برای ادامه، اطلاعات حساب ادمین را وارد کنید.</p>

        <form method="post" action="{{ url_for('admin.login_submit') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label for="admin-username">نام کاربری</label>
            <input id="admin-username" name="username" type="text"
                   autocomplete="username" maxlength="100" required autofocus>

            <label for="admin-password">رمز عبور</label>
            <input id="admin-password" name="password" type="password"
                   autocomplete="current-password" required>

            <button type="submit" class="admin-primary-button">
                ورود امن
                <i class="bi bi-arrow-left"></i>
            </button>
        </form>
        <a class="admin-login-back" href="{{ url_for('pages.home') }}">
            بازگشت به وب‌سایت
        </a>
    </div>
</section>
{% endblock %}
